# 데이터 설정
data:
  tickers: ['SPY', 'QQQ', 'VIXY', 'TLT', 'GLD']
  target_tickers: ['SPY', 'QQQ']
  optimization_target: 'SPY'
  master_file: 'master_features_SPY.csv'
  start_date: '2010-01-01'
  end_date: '2025-07-31'
  raw_path: 'data/raw'
  processed_path: 'data/processed'
  window_size: 20

# 모델 설정
model:
  input_size: 15
  hidden_size: 128
  num_layers: 2
  dropout: 0.4
  num_classes: 2

# 학습 설정
training:
  learning_rate: 0.001
  epochs: 100
  batch_size: 64
  early_stopping_patience: 10
  train_end_date: '2021-12-31'
  validation_end_date: '2023-12-31'

# 결과 및 산출물
output:
  model_path: 'models/best_model.pth'
  results_path: 'results'
